---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
polling_url: https://www.wienerlinien.at/ogd_realtime/trafficInfoList?relatedLine={{ wl_lines }}&relatedStop={{ wl_stop }}
polling_headers: accept=application/json&content-type=application/json
polling_body: "{ }"
id: 250757
custom_fields:
- keyname: about
  name: About This Plugin
  category: travel
  field_type: author_bio
  description: Public Transport Disruptions for Vienna (Wiener Linien) provided by the Wiener Linien API. Image loaded from wikipedia.org
  github_url: https://github.com/Macusercom/TRMNL-Vienna-Public-Transport-Disruptions/
- keyname: wl_lines
  field_type: multi_string
  name: Wiener Linien Public Transport Lines
  description: Enter one line per field, e.g. U1, 49, 8A or S3
  placeholder: U1
  help_text: Use the "+" button to add more lines.
- keyname: wl_stop
  field_type: multi_string
  name: Stop IDs (optional)
  description: Filter disruptions by a specific stop. Find your Stop ID at <a href="https://till.mabe.at/rbl/" target="_blank" class="underline">till.mabe.at/rbl/</a>
  placeholder: 4117
  optional: true
- keyname: wl_exclude
  field_type: multi_string
  name: Excluded Keywords (optional)
  description: Hide disruptions whose title or description contains one of these words, e.g. Bauarbeiten
  placeholder: Bauarbeiten
  help_text: One keyword per field, case-insensitive
  optional: true
- keyname: wl_max_age
  field_type: number
  name: Maximum Age (days, optional)
  description: Hide long-running disruptions that started more than this many days ago
  placeholder: 8
  min: 0
  max: 365
  help_text: Leave empty or enter 0 to show all disruptions
  optional: true
- keyname: wl_sort
  field_type: select
  name: Sort Order
  description: Newest disruption first, or grouped by the order you entered your lines above
  options:
  - "Newest first": "time"
  - "My line order": "lines"
  default: "time"
- keyname: wl_compact
  field_type: select
  name: Compact Mode
  description: Show line, title and start time only — fits more disruptions on screen
  options:
  - "Off": "off"
  - "Half and quadrant layouts only": "small"
  - "All layouts": "all"
  default: "off"
name: Vienna Public Transport Disruptions
description: Wiener Linien disruptions
recipe_overview: |
  See at a glance whether your Vienna public transport lines are running normally. This recipe polls the official Wiener Linien real-time Open Data API and lists every active disruption on the lines you choose (U-Bahn, tram or bus), with the affected line, a short title, the expected duration, the reason and the time it started. When everything runs on schedule, a large check mark confirms it.

  Optional settings narrow the list to specific stops, hide disruptions by keyword (for example planned construction work), drop long-running disruptions older than a chosen number of days, sort by newest first or by your own line order, and switch to a compact view that fits more entries on the smaller layouts. Disruption texts are shown in German, exactly as Wiener Linien publishes them.
refresh_interval: 60
