name: TRMNL
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - run: gem install trmnl_preview
      # Wikimedia answers 403 to requests from CI runners, so trmnlp's <img> src
      # check always fails here. Tolerate that one finding, fail on anything else.
      - name: Lint
        run: |
          set +e
          trmnlp lint | tee lint.out
          status=${PIPESTATUS[0]}
          set -e
          [ "$status" -eq 0 ] && exit 0
          findings=$(grep -c '^  [0-9]\+\.' lint.out || true)
          if [ "$findings" -eq 1 ] && grep -q 'does not respond to HTTP GET' lint.out; then
            echo "::warning::Only the known Wikimedia logo URL check failed — continuing"
            exit 0
          fi
          exit 1

  # tests/plugin_spec.rb: every view on TRMNL OG and TRMNL X, every select option and a failing
  # API, in the trmnlp image (Firefox included). Pin the tag to keep runs repeatable.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: trmnlp test
        run: >
          docker run --rm -e CI=true -e GITHUB_STEP_SUMMARY=/summary.md
          -v "$PWD":/plugin -v "$GITHUB_STEP_SUMMARY":/summary.md trmnl/trmnlp:v0.34.1
          test --report report
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trmnlp-report
          path: report

  push:
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - run: gem install trmnl_preview
      - run: trmnlp push --force
        env:
          TRMNL_API_KEY: ${{ secrets.TRMNL_API_KEY }}
